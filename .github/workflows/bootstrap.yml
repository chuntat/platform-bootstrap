name: Platform Bootstrap

on:
  workflow_dispatch:

jobs:
  bootstrap:

    runs-on: ubuntu-latest

    env:
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      CLUSTER_ID: ${{ secrets.CLUSTER_ID }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      NEBIUS_SERVICE_ACCOUNT_JSON: ${{ secrets.NEBIUS_SERVICE_ACCOUNT_JSON }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nebius CLI
        run: |
          curl -sSL https://storage.eu-north1.nebius.cloud/cli/install.sh | bash

      - name: Verify Nebius CLI
        run: |
          ~/.nebius/bin/nebius version

      - name: Create Service Account File
        run: |
          cat > sa.json <<'EOF'
          ${{ secrets.NEBIUS_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Create Nebius Profile
        run: |
          ~/.nebius/bin/nebius profile create ci-profile \
            --service-account-file sa.json \
            --parent-id $PROJECT_ID

      - name: Show Current Profile
        run: |
          ~/.nebius/bin/nebius profile get ci-profile

      - name: List Clusters
        run: |
          ~/.nebius/bin/nebius mk8s cluster list