name: Platform Bootstrap

on:
  workflow_dispatch:

jobs:
  bootstrap:

    runs-on: ubuntu-latest

    env:
      NEBIUS_TOKEN: ${{ secrets.NEBIUS_TOKEN }}
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      CLUSTER_ID: ${{ secrets.CLUSTER_ID }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Cluster
        run: |
          echo "Cluster ID: $CLUSTER_ID"