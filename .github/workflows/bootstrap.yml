name: Platform Bootstrap

on:
  workflow_dispatch:

jobs:
  bootstrap:

    runs-on: ubuntu-latest

    env:
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      CLUSTER_ID: ${{ secrets.CLUSTER_ID }}
      NEBIUS_SERVICE_ACCOUNT_JSON: ${{ secrets.NEBIUS_SERVICE_ACCOUNT_JSON }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nebius CLI
        run: |
          curl -sSL https://storage.eu-north1.nebius.cloud/cli/install.sh | bash

      - name: Verify Nebius CLI
        run: |
          ~/.nebius/bin/nebius version

      - name: Create Service Account Credential File
        run: |
          echo "$NEBIUS_SERVICE_ACCOUNT_JSON" > sa.json

      - name: Verify Credential File Exists
        run: |
          ls -lh sa.json

      # Authentication step
      # We'll verify the exact syntax from Nebius docs
      # before filling this in.

      - name: Show Cluster ID
        run: |
          echo "Cluster ID configured"